<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boris</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
    {
      "imports": {
        "marked": "./vendor/marked.esm.js",
        "dompurify": "./vendor/purify.es.mjs"
      }
    }
  </script>
</head>
<body>
  <div class="app">
    <header class="chat-header">
      <div class="avatar">B</div>
      <div class="header-info">
        <h1>Boris</h1>
        <span class="status">En linea</span>
        <span class="execution-mode-indicator">
          <span class="execution-mode-label">Modo:</span>
          <span class="execution-mode-value" id="execution-mode-indicator">Controlado</span>
        </span>
      </div>
    </header>

    <main class="chat-messages" id="messages">
      <div class="message bot">
        <div class="bubble">Hola, soy Boris. En que puedo ayudarte?</div>
      </div>
      <div class="token-counter" id="token-counter">0 tokens</div>
    </main>

    <footer class="chat-input">
      <label class="execution-mode-toggle">
        <input type="checkbox" id="execution-mode-toggle-switch" class="execution-mode-toggle-switch" aria-label="Modo de ejecución" />
        <span class="execution-mode-toggle-slider"></span>
      </label>
      <textarea id="input" rows="1" placeholder="Escribe un mensaje..." aria-label="Escribe un mensaje"></textarea>
      <button id="send" type="button" aria-label="Enviar mensaje">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2 11 13" />
          <path d="M22 2 15 22 11 13 2 9z" />
        </svg>
      </button>
    </footer>
  </div>

  <div class="browser-control-overlay" id="browser-control-overlay" hidden>
    <div class="browser-control-dialog" role="dialog" aria-modal="false" aria-label="Control del navegador">
      <button id="browser-stop" type="button" aria-label="Detener el agente">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
          <rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor" />
        </svg>
      </button>
    </div>
  </div>

  <script type="module" src="chat.js"></script>
</body>
</html>
